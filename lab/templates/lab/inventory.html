{% extends "lab/base.html" %}
{% block title %}Inventário{% endblock %}
{% block content %}
<h1>Inventário</h1>
<form method="get" class="panel">
    <label for="q">Item</label>
    <input id="q" name="q" value="{{ term }}" placeholder="Ex.: Orbit">
    <button type="submit">Pesquisar</button>
</form>
<div class="results">
    {% for item in items %}
        <article class="result"><h3>{{ item.name }}</h3><p><strong>SKU:</strong> {{ item.sku }}</p><p><strong>Quantidade:</strong> {{ item.quantity }}</p></article>
    {% empty %}
        <p>Nenhum item encontrado.</p>
    {% endfor %}
</div>
{% endblock %}
