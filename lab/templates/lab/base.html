{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}VulnLab{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'lab/styles.css' %}">
</head>
<body>
    <header class="topbar">
        <div class="container topbar-inner">
            <a class="brand" href="{% url 'lab:home' %}">VulnLab</a>
            <nav>
                <a href="{% url 'lab:home' %}">Home</a>
                <a href="{% url 'lab:progress' %}">Flags</a>
            </nav>
        </div>
    </header>
    <div class="warning">LAB LOCAL INTENCIONALMENTE VULNERÁVEL — NÃO EXPOR NA INTERNET</div>
    <main class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
